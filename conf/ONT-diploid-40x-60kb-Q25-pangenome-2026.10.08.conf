# Shasta2 assembly configuration tested for:
# - External anchors from the pangenome.
# - Diploid genome.
# - Coverage 40x
# - Read N50 60 kb.
# - Q25 reads (0.5% error rate or less), without error correction.

# Reads.
min-read-length = 0

# Markers.
k = 0

# Anchor graph.
min-anchor-graph-edge-coverage = 6
min-anchor-graph-edge-coverage-fraction = 0.25
transitive-reduction-max-edge-coverage = 10
transitive-reduction-max-distance = 20

# These are used for phasing.
detangle-maxLogP = 30
detangle-minLogPDelta = 30
detangle-epsilon = 0.02
find-superbubbles-max-distance = 100

# Read following.
read-following-min-common-count = 3
read-following-segment-length-threshold = 30000
read-following-prune-length = 10000

# Sequence assembly.
use-msa1 = true
homopolymer-model = "ONT-R10.4.1-sup5.0.0-2026-09-28"

# Assembly.
create-pseudo-assembly = true

